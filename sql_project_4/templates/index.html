<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Night Ideas!!</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
      <div id="leHeader">
            <h1>Here is the ultimate place to store all your best ideas!!</h1>
            <h2>You will add a category then the specified idea</h2>
            <p>Add your project that you want to postpone!</p>
      </div>

      <div class="pic-form">
            <div class="pic-side">
                  <img src="{{ url_for('static', filename='assets/ideas.jpg') }}" alt="some random cute picture">
            </div>
            <div class="form-side">
                  <h3 id="formTitle" class="form-title">Would you like to add an idea?</h3>

                  <div class="form-actions">
                        <form id="ideaForm">
                              <input type="hidden" id="ideaId" name="id">

                              <label for="titleInput">Title:</label>
                              <input type="text" id="titleInput" required placeholder="e.g. Stargazing at the Park">

                              <label for="categoryInput">Category:</label>
                              <input type="text" id="categoryInput" required placeholder="e.g. Outdoor, Cozy, Foodie">

                              <label for="costInput">Estimated Cost ($):</label>
                              <input type="number" step="0.01" id="costInput" required placeholder="e.g. 25.00">

                              <label for="locationInput">Location:</label>
                              <input type="text" id="locationInput" required placeholder="e.g. Memory Grove Park">

                              <label for="notesInput">Notes:</label>
                              <textarea id="notesInput" rows="3" placeholder="Bring blankets and snacks!"></textarea>

                              <button id="submitBtn" class="rose-gold-btn" type="submit">Submit Idea</button>
                              <button id="cancelBtn" type="button" class="cancel-btn" style="display: none;">Cancel Edit</button>
                        </form>
                  </div>
            </div>
      </div>

      <div id="listSection">
            <h1>Here is a list of some ideas!</h1>
            <div id="listIdeas"></div>
      </div>

      <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
